name: visual-tests

# Visual regression runs on every pull request, and on `main` so the committed
# baselines are exercised against the merged tree. It is a separate workflow from
# `ci` on purpose: the required status check for `main` is named exactly `ci`, and
# a visual failure should be additive signal, not a rewrite of that gate.
on:
  pull_request:
  push:
    branches: [main, pr/442]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The official Playwright image pins the browser build *and* the font set.
    # Baselines are generated in this exact image, so a diff here means the
    # interface changed — not that the runner happens to have different fonts.
    # Keep the tag in step with devDependencies' @playwright/test: a mismatch
    # reports "Executable doesn't exist" instead of comparing any pixels.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble

    steps:
      - uses: actions/checkout@v7

      # The image already ships Node and the browsers under $PLAYWRIGHT_BROWSERS_PATH,
      # so nothing needs downloading beyond the package dependencies.
      - name: Install dependencies
        run: npm ci

      # The suite runs against the production build; the dev server overlays its
      # own UI, which is not part of what ships.
      - name: Build
        run: npm run build

      - name: Visual regression
        run: npm run test:visual

      # Uploaded on any outcome so the report is inspectable after a flake, but
      # the diff images themselves only exist when the run failed.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14

  # One-off maintenance job: regenerate the committed baselines inside the exact
  # container image the comparison runs in, then push them back to the branch.
  # Gated on the commit message so ordinary pushes never enter it (the run would
  # otherwise loop on its own baseline commit, whose message does not match).
  update-screenshots:
    name: update screenshots (CI)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'update-screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The suite starts the production server itself (webServer in the config),
      # inside the same image whose fonts the baselines are generated against.
      - name: Regenerate baselines
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots

      - name: Push refreshed baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet -- 'tests/visual/__screenshots__'; then
            echo "Baselines already match; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/visual/__screenshots__'
          git commit -m "Refresh visual baselines in the CI container image"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
